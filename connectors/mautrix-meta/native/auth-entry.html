<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google" content="notranslate">
<title>连接 Facebook Messenger · 言策</title>
<style>
:root{color-scheme:light}body{font:15px/1.65 system-ui,-apple-system,sans-serif;background:#f4f7fa;color:#183247;min-height:100vh;margin:0;display:grid;place-items:center}
main{width:min(510px,calc(100% - 44px));background:white;border:1px solid #dce5ed;border-radius:18px;padding:30px;box-shadow:0 12px 38px #17364d12}
h1{font-size:24px;margin:0 0 8px}p{margin:8px 0 16px}.sub{color:#526476}.status{font-size:13px;color:#526476;background:#eff3f6;padding:9px 12px;border-radius:7px;margin:14px 0}

<h1>连接 Facebook Messenger</h1>
<p class="sub">使用 Facebook 网页方式连接，不再使用此前反复触发安全检查的手机模拟登录。</p>
<p class="status">已准备好本机官方登录助手，登录后才会连接你的 Messenger 账号。</p>
<form method="post" action="/api/v2/providers/fb-personal/launch-manager">
<input type="hidden" name="ticket" value="__W26_LAUNCH_TICKET__">
<button type="submit">打开 Facebook 网页登录</button>
</form>
<small>点击后会打开官方 mautrix-manager。选择 Facebook Messenger，然后选择 facebook.com，在弹出的 Facebook 网页中由本人完成授权。无需 Matrix 参数或复制 Cookie。</small>
</main></body></html>
