<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>连接 Facebook Messenger · 言策</title>
<style>
:root{color-scheme:light}body{font:15px/1.6 system-ui,-apple-system,sans-serif;background:#f4f7fa;color:#183247;min-height:100vh;margin:0;display:grid;place-items:center}
main{width:min(540px,calc(100% - 44px));background:white;border:1px solid #dce5ed;border-radius:18px;padding:30px;box-shadow:0 12px 38px #17364d12}
h1{font-size:24px;margin:0 0 8px}p{margin:8px 0 14px}.sub{color:#526476}.status{font-size:13px;color:#5a6874;background:#eff3f6;padding:8px 12px;border-radius:7px;margin:14px 0}
button{background:#176cbe;color:white;border:0;border-radius:9px;padding:11px 16px;font:inherit;cursor:pointer;margin:7px 7px 7px 0}
button:disabled{opacity:.5;cursor:default}button.secondary{background:#e8f0f7;color:#164e7e}
label{font-weight:600;display:block;margin-top:13px}input,select{display:block;width:100%;box-sizing:border-box;padding:11px;border:1px solid #b7c4d0;border-radius:8px;font:inherit;margin-top:5px}
.error{color:#ad3434;white-space:pre-wrap}small{display:block;color:#5c6d79;margin-top:4px}.hidden{display:none}
</style>
</head><body><main>
<h1>连接 Facebook Messenger</h1>
<p class="sub">选择你使用的 Messenger 方式，按提示由本人完成登录和验证码确认。言策不会自动向任何人发送消息。</p>
<p class="status" id="status" role="status">正在检查 Messenger 连接服务…</p>
<input type="hidden" name="ticket" value="__W26_LAUNCH_TICKET__" id="ticket">
<section id="flows"></section>
<section id="step" aria-live="polite"></section>
<p id="error" class="error" role="alert"></p>
<button class="secondary hidden" id="retry" type="button">重新检查连接</button>
</main>
<script type="module" src="/api/v2/providers/fb-personal/native-login-ui.mjs"></script>
</body></html>
