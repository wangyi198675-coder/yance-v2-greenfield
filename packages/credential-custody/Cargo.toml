[package]
name = "yance-w55-fake-credential-custody"
version = "0.0.1"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "Nonproduction Windows-only sealed Credential Manager / DPAPI fake-material test library"

[dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_System_Threading"] }
sha2 = "=0.10.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
base64 = "=0.22.1"
zeroize = "=1.9.1"

[lib]
path = "src/lib.rs"
