[package]
name = "yance-v2-native-session-lab"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Nonproduction native Windows identity/IPC qualification host"
license = "MIT"
build = "build.rs"

[build-dependencies]
tauri-build = "=2.7.0"

[dependencies]
tauri = { version = "=2.12.0", default-features = true }
serde = { version = "=1.0.229", features = ["derive"] }
getrandom = "=0.3.4"
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_System_Com"
] }

[dev-dependencies]
serde_json = "=1.0.151"

[profile.dev]
debug = 0
